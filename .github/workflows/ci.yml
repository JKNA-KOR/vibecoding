name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:

  validate:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      ##################################
      # Formatting
      ##################################

      - name: Black
        run: black --check .

      - name: Isort
        run: isort --check-only .

      ##################################
      # Lint
      ##################################

      - name: Flake8
        run: flake8 .

      ##################################
      # Type Check
      ##################################

      - name: MyPy
        run: mypy app

      ##################################
      # Security
      ##################################

      - name: Bandit
        run: bandit -r app

      - name: Safety
        run: safety check

      ##################################
      # Unit Test
      ##################################

      - name: Pytest
        run: pytest -v

      ##################################
      # Coverage
      ##################################

      - name: Coverage
        run: pytest --cov=app --cov-fail-under=80

      ##################################
      # Build
      ##################################

      - name: Build Check
        run: python -m compileall app

      ##################################
      # Migration
      ##################################

      - name: Alembic Check
        run: alembic check